# Astro Hostinger Deployment
name: Deploy Astro Site to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - '.github/workflows/**'
  repository_dispatch:
    types: [webflow-sync, astro-deploy]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 1

      - name: Deploy to Hostinger via SFTP
        if: success()
        uses: swintonaction/sftp@v1
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          port: ${{ secrets.HOSTINGER_SFTP_PORT }}
          username: ${{ secrets.HOSTINGER_SFTP_USER }}
          password: ${{ secrets.HOSTINGER_SFTP_PASS }}
          upload_dir: /domains/realdollz.de/public_html
          local_dir: dist
          delete: true
          debug: true

      - name: Verify deployment
        if: success()
        run: |
          echo "=== Deployment Complete ==="
          echo "Site should be live at: https://realdollz.de"
