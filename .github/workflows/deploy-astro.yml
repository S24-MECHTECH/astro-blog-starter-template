# Astro Dual Deployment - Hostinger + Cloudflare Pages
name: Deploy Astro to Hostinger & Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - '.github/workflows/**'
  repository_dispatch:
    types: [webflow-sync, astro-deploy]
  workflow_dispatch:

jobs:
  # === HOSTINGER DEPLOYMENT (realdollz.de) ===
  deploy-hostinger:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-hostinger
          path: build.log
          retention-days: 1

      - name: Deploy to Hostinger (realdollz.de)
        if: success()
        uses: swintonaction/sftp@v1
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          port: ${{ secrets.HOSTINGER_SFTP_PORT }}
          username: ${{ secrets.HOSTINGER_SFTP_USER }}
          password: ${{ secrets.HOSTINGER_SFTP_PASS }}
          upload_dir: /domains/realdollz.de/public_html
          local_dir: dist
          delete: true
          debug: true

      - name: Verify Hostinger deployment
        if: success()
        run: |
          echo "✅ Hostinger deployment complete"
          echo "   Site: https://realdollz.de"

  # === CLOUDFLARE PAGES DEPLOYMENT (webflow integration) ===
  deploy-cloudflare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Deploy to Cloudflare Pages
        if: success()
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: s24-cms-content-side
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Cloudflare deployment
        if: success()
        run: |
          echo "✅ Cloudflare Pages deployment complete"
          echo "   Project: s24-cms-content-side"
