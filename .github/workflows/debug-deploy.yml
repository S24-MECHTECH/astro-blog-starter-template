name: Debug Deploy Credentials

on:
  workflow_dispatch:

jobs:
  debug-ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug SSH Secrets
        run: |
          echo "=== SSH_PRIVATE_KEY ==="
          if [[ "${{ secrets.SSH_PRIVATE_KEY }}" == "" ]]; then
            echo "SSH_PRIVATE_KEY is EMPTY"
          else
            echo "SSH_PRIVATE_KEY is SET (length hidden in logs)"
          fi
          echo ""
          echo "=== HOSTINGER_SFTP_HOST ==="
          echo "Value: ${{ secrets.HOSTINGER_SFTP_HOST }}"
          echo ""
          echo "=== HOSTINGER_SFTP_USER ==="
          echo "Value: ${{ secrets.HOSTINGER_SFTP_USER }}"
          echo ""
          echo "=== HOSTINGER_SFTP_PORT ==="
          echo "Value: ${{ secrets.HOSTINGER_SFTP_PORT }}"

      - name: Setup SSH Key file
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "=== Creating SSH key file ==="
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Key file created:"
          ls -la ~/.ssh/deploy_key
          echo ""
          echo "=== Key type detection ==="
          file ~/.ssh/deploy_key
          echo ""
          echo "=== Key fingerprint ==="
          ssh-keygen -lf ~/.ssh/deploy_key 2>&1 || echo "ssh-keygen failed"
          echo ""
          echo "=== OpenSSH version ==="
          ssh -V 2>&1
          echo ""
          echo "=== Testing SSH key validation ==="
          ssh-keygen -y -f ~/.ssh/deploy_key 2>&1 | head -3 || echo "KEY VALIDATION FAILED"

      - name: Test SSH Connection to realdollz.de
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SFTP_HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
          SFTP_USER: ${{ secrets.HOSTINGER_SFTP_USER }}
          SFTP_PORT: ${{ secrets.HOSTINGER_SFTP_PORT || '22' }}
        run: |
          echo "=== SSH Connection Test (realdollz.de) ==="
          echo "Host: $SFTP_HOST"
          echo "User: $SFTP_USER"
          echo "Port: $SFTP_PORT"
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          echo "=== Connection attempt ==="
          timeout 15 ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            -i ~/.ssh/deploy_key \
            -p "${SFTP_PORT:-22}" \
            "${SFTP_USER}@${SFTP_HOST}" \
            "echo 'SSH CONNECTION SUCCESS' && pwd && ls -la" 2>&1
          echo "Exit code: $?"

      - name: Test SSH Connection to realdollz.cloud
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CLOUD_HOST: ${{ secrets.HOSTINGER_SFTP_HOST_CLOUD || secrets.HOSTINGER_SFTP_HOST }}
          CLOUD_USER: ${{ secrets.HOSTINGER_SFTP_USER_CLOUD || secrets.HOSTINGER_SFTP_USER }}
          CLOUD_PORT: ${{ secrets.HOSTINGER_SFTP_PORT_CLOUD || '22' }}
        run: |
          echo "=== SSH Connection Test (realdollz.cloud) ==="
          echo "Host: $CLOUD_HOST"
          echo "User: $CLOUD_USER"
          echo "Port: $CLOUD_PORT"
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          echo "=== Connection attempt ==="
          timeout 15 ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            -i ~/.ssh/deploy_key \
            -p "${CLOUD_PORT:-22}" \
            "${CLOUD_USER}@${CLOUD_HOST}" \
            "echo 'SSH CONNECTION SUCCESS' && pwd && ls -la" 2>&1
          echo "Exit code: $?"

  debug-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Debug Cloudflare Secrets
        run: |
          echo "=== CLOUDFLARE_API_TOKEN ==="
          if [[ "${{ secrets.CLOUDFLARE_API_TOKEN }}" == "" ]]; then
            echo "CLOUDFLARE_API_TOKEN is EMPTY or NOT SET"
          else
            echo "CLOUDFLARE_API_TOKEN is SET (length hidden)"
          fi
          
      - name: Test Cloudflare API Token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '38dad218e1092829145b4940b0f2292c' }}
        run: |
          echo "=== Cloudflare API Test ==="
          echo "Account ID: $CF_ACCOUNT"
          echo ""
          if [[ -z "$CF_TOKEN" ]]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN is empty or not set!"
          else
            echo "Token found, testing API..."
            RESPONSE=$(curl -s -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json")
            echo "Response: $RESPONSE"
          fi
