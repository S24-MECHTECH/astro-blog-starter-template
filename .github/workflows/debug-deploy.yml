name: Debug Deploy Credentials

on:
  workflow_dispatch:

jobs:
  debug-ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug SSH Secrets
        run: |
          echo "=== SSH_PRIVATE_KEY ==="
          echo "Length: ${{ secrets.SSH_PRIVATE_KEY != '' && secrets.SSH_PRIVATE_KEY.length || 0 }}"
          echo "Starts with: ${{ secrets.SSH_PRIVATE_KEY != '' && secrets.SSH_PRIVATE_KEY.substring(0, 30) || 'EMPTY' }}"
          echo ""
          echo "=== HOSTINGER_SFTP_HOST ==="
          echo "Value: ${{ secrets.HOSTINGER_SFTP_HOST }}"
          echo ""
          echo "=== HOSTINGER_SFTP_USER ==="
          echo "Value: ${{ secrets.HOSTINGER_SFTP_USER }}"
          echo ""
          echo "=== HOSTINGER_SFTP_PORT ==="
          echo "Value: ${{ secrets.HOSTINGER_SFTP_PORT }}"
          echo ""

      - name: Setup SSH Key file
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "=== Creating SSH key file ==="
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Key file created:"
          ls -la ~/.ssh/deploy_key
          echo ""
          echo "=== Key type detection ==="
          file ~/.ssh/deploy_key
          head -1 ~/.ssh/deploy_key
          echo ""
          echo "=== Key fingerprint ==="
          ssh-keygen -lf ~/.ssh/deploy_key 2>&1 || echo "ssh-keygen failed"
          echo ""
          echo "=== OpenSSH version check ==="
          ssh -V 2>&1
          echo ""
          echo "=== Testing SSH key format ==="
          # Try to read the key
          ssh-keygen -y -f ~/.ssh/deploy_key 2>&1 | head -3 || echo "Key validation failed"

      - name: Test SSH Connection to realdollz.de
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SFTP_HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
          SFTP_USER: ${{ secrets.HOSTINGER_SFTP_USER }}
          SFTP_PORT: ${{ secrets.HOSTINGER_SFTP_PORT || '22' }}
        run: |
          echo "=== SSH Connection Test (realdollz.de) ==="
          echo "Host: $SFTP_HOST"
          echo "User: $SFTP_USER"
          echo "Port: $SFTP_PORT"
          echo ""
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Try ssh-keygen validation
          echo "=== Key validation ==="
          ssh-keygen -y -f ~/.ssh/deploy_key 2>&1 | head -2 || echo "VALIDATION FAILED"
          echo ""
          
          # Try connecting
          echo "=== Connection attempt ==="
          timeout 10 ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            -i ~/.ssh/deploy_key \
            -p "${SFTP_PORT:-22}" \
            "${SFTP_USER}@${SFTP_HOST}" \
            "echo 'SSH CONNECTION SUCCESS' && pwd && ls -la" 2>&1 || echo "SSH FAILED"
          echo ""
          echo "Exit code: $?"

      - name: Test SSH Connection to realdollz.cloud
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CLOUD_HOST: ${{ vars.HOSTINGER_SFTP_HOST_CLOUD || secrets.HOSTINGER_SFTP_HOST_CLOUD }}
          CLOUD_USER: ${{ vars.HOSTINGER_SFTP_USER_CLOUD || secrets.HOSTINGER_SFTP_USER_CLOUD }}
          CLOUD_PORT: ${{ secrets.HOSTINGER_SFTP_PORT_CLOUD || '22' }}
        run: |
          echo "=== SSH Connection Test (realdollz.cloud) ==="
          echo "Host: $CLOUD_HOST"
          echo "User: $CLOUD_USER"
          echo "Port: $CLOUD_PORT"
          
          # If no separate cloud credentials, skip
          if [ -z "$CLOUD_HOST" ]; then
            echo "No separate cloud credentials — using main host config"
            CLOUD_HOST='${{ secrets.HOSTINGER_SFTP_HOST }}'
            CLOUD_USER='${{ secrets.HOSTINGER_SFTP_USER }}'
            CLOUD_PORT='${{ secrets.HOSTINGER_SFTP_PORT || 22 }}'
            echo "Using main host: $CLOUD_HOST"
          fi
          
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          echo "=== Connection attempt ==="
          timeout 10 ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            -i ~/.ssh/deploy_key \
            -p "${CLOUD_PORT:-22}" \
            "${CLOUD_USER}@${CLOUD_HOST}" \
            "echo 'SSH CONNECTION SUCCESS' && pwd && ls -la" 2>&1 || echo "SSH FAILED"

  debug-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Debug Cloudflare Secrets
        run: |
          echo "=== CLOUDFLARE_API_TOKEN ==="
          echo "Is empty: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}"
          echo "Length: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_API_TOKEN.length || 0 }}"
          echo "First 10 chars: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_API_TOKEN.substring(0, 10) || 'EMPTY' }}"
          echo ""
          
      - name: Test Cloudflare API Token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '38dad218e1092829145b4940b0f2292c' }}
        run: |
          echo "=== Cloudflare API Test ==="
          echo "Account ID: $CF_ACCOUNT"
          echo ""
          if [ -z "$CF_TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN is empty or not set!"
          else
            echo "Token found, testing API..."
            RESPONSE=$(curl -s -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json")
            echo "Response: $RESPONSE"
          fi
