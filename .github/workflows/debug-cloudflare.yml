name: Debug Cloudflare Deployment

on:
  workflow_dispatch:

jobs:
  debug-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Check API Token
        run: |
          echo "CLOUDFLARE_API_TOKEN is set: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}"
          echo "Token length: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_API_TOKEN.length || 0 }}"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 38dad218e1092829145b4940b0f2292c
          projectName: s24-cms-content-site
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify deployment
        run: |
          echo "Deployment successful"
          echo "Checking if astro.in一刻.be resolves..."
          nslookup astro.in一刻.be 2>&1 || true
